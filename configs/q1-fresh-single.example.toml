# Single GPU, initialized from zero. Paths resolve relative to this file.
[train]
robot_xml = "../assets/q1_v2/xml/q1_v2_mc.xml"
motion_dir = "../data/q1_motion_library_filtered"
output_dir = "../logs/q1_fresh_single"
motion_pattern = "*/*.npz"
max_motions = 0
device = "cuda:0"
num_envs = 1024
model_batch_size = 512
policy_batch_size = 512
iterations = 250000
replay_steps = 1000
model_batches = 10
critic_epochs = 5
critic_minibatches = 4
learning_rate = 0.0002
physics_timestep = 0.002
action_scale = 0.5
use_tn = true
q1_reward_scaling = true
motion_storage = "device-fp16"
motion_memory_gb = 16.0
compile_networks = true
compile_collection = true
fuse_model_loss = true
cache_reference_heads = true
cache_goals = true
capture_reset = true
capture_imagination = true
compile_critic = false
fused_optimizers = false
runtime_checks = "per_update"
clean_policy_actions = true
action_lag = false
action_noise = 0.0
modeled_action_delay = true
network_activation = "silu"
dynamics_representation = "heading"
normalize_policy_objective = true
normalize_model_objective = true
reward_arm_joint_weight = 0.05
reward_arm_pd_target_weight = 0.0
save_interval = 5000
initial_save_iteration = 100
profile_every = 10
collective_timeout_seconds = 1800
seed = 0
